<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bestie Bond 💜</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<div class="container">
  <div class="left">
    <h1>💜 Bestie Bond</h1>
    <p class="subtitle">Chaos partners since day one ✨</p>

    <div id="counter">
      <span id="days">0</span> days
      <span id="hours">00</span> hrs
      <span id="minutes">00</span> min
      <span id="seconds">00</span> sec
    </div>

    <button id="surpriseBtn">🎁 Surprise</button>

    <div id="surprise" class="hidden">
      You’re my comfort human 💜  
      My safe place. My forever bestie.
    </div>
  </div>

  <div class="right">
    <canvas id="heartCanvas"></canvas>
  </div>
</div>

<script src="heart.js"></script>
<script src="script.js"></script>
</body>
</html>
